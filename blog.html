<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — KCONE Pilates</title>
<meta name="description" content="KCONE Pilates blog — insights on Pilates equipment, studio setup, and industry trends from a factory-direct manufacturer.">
<link rel="canonical" href="https://kconepilates.com/blog">
<meta property="og:type" content="website">
<meta property="og:title" content="Blog — KCONE Pilates">
<meta property="og:description" content="Insights on Pilates equipment, studio setup, and industry trends from a factory-direct manufacturer.">
<meta property="og:url" content="https://kconepilates.com/blog">
<meta property="og:image" content="https://kconepilates.com/shop/Full Studio Setup.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --black: #0f0f0f;
  --white: #fafaf8;
  --off: #f2f1ed;
  --gray: #8a8880;
  --gray-light: #b8b6b2;
  --border: rgba(15,15,15,0.1);
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--white);
  color: var(--black);
  font-size: 15px;
  line-height: 1.6;
}
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  height: 64px;
  border-bottom: 1px solid var(--border);
  background: rgba(250,250,248,0.95);
}
nav a {
  text-decoration: none;
  color: var(--gray);
  font-size: 12px;
  letter-spacing: 0.08em;
  transition: color 0.2s;
}
nav a:hover { color: var(--black); }
nav a.active { color: var(--black); }
.nav-links { display: flex; align-items: center; gap: 28px; }
.page-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}
.page-header { margin-bottom: 48px; }
.page-header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  font-weight: 300;
  margin-bottom: 8px;
}
.page-header p {
  color: var(--gray);
  font-size: 15px;
}
.post-list { display: flex; flex-direction: column; gap: 0; }
.post-item {
  padding: 28px 0;
  border-top: 1px solid var(--border);
  text-decoration: none;
  color: inherit;
  display: block;
  transition: padding-left 0.2s;
}
.post-item:last-child { border-bottom: 1px solid var(--border); }
.post-item:hover { padding-left: 8px; }
.post-date {
  font-size: 12px;
  color: var(--gray-light);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.post-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 400;
  margin-bottom: 8px;
  transition: color 0.2s;
  line-height: 1.3;
}
.post-item:hover .post-title { color: #555; }
.post-summary {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.7;
}
.post-read {
  font-size: 12px;
  color: var(--black);
  letter-spacing: 0.08em;
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.post-read::after { content: '→'; transition: transform 0.2s; }
.post-item:hover .post-read::after { transform: translateX(3px); }

.loading, .empty, .error {
  text-align: center;
  padding: 80px 0;
  color: var(--gray);
  font-size: 14px;
}
.loading .spinner {
  width: 32px; height: 32px;
  margin: 0 auto 16px;
  border: 2px solid var(--border);
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer {
  background: var(--black);
  color: rgba(245,244,240,0.3);
  padding: 28px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
}
.footer-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  color: rgba(245,244,240,0.55);
  letter-spacing: 0.12em;
}
@media (max-width: 768px) {
  nav { padding: 0 20px; }
  .page-wrap { padding: 32px 20px 60px; }
  .page-header h1 { font-size: 32px; }
  .post-title { font-size: 22px; }
  .post-item:hover { padding-left: 4px; }
}
</style>
</head>
<body>

<nav>
  <a href="/">KCONE</a>
  <div class="nav-links">
    <a href="/">SHOP</a>
    <a href="rx-detail">NEW ARRIVAL</a>
    <a href="blog" class="active">BLOG</a>
    <a href="index.html#contact">CONTACT</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Blog</h1>
    <p>Pilates equipment insights, studio tips, and industry stories from the KCONE team.</p>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    Loading articles...
  </div>
  <div id="empty" class="empty" style="display:none;">
    <p>No articles yet. Check back soon!</p>
  </div>
  <div id="error" class="error" style="display:none;"></div>
  <div id="postList" class="post-list" style="display:none;"></div>
</div>

<footer>
  <div class="footer-logo">KC ONE</div>
  <div>© 2025 KCONE. All rights reserved.</div>
</footer>

<script>
// ⚠️ 改成你的 Worker 地址
const RSS_URL = 'https://你的-worker名.用户名.workers.dev';

(async function loadPosts() {
  try {
    const res = await fetch(RSS_URL);
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';

    if (!data.posts || data.posts.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    const list = document.getElementById('postList');
    list.style.display = 'block';

    data.posts.forEach(post => {
      const item = document.createElement('a');
      item.className = 'post-item';
      item.href = post.link;
      item.target = '_blank';
      item.rel = 'noopener';
      item.innerHTML = `
        <div class="post-date">${post.date}</div>
        <h2 class="post-title">${post.title}</h2>
        ${post.summary ? `<p class="post-summary">${post.summary}</p>` : ''}
        <span class="post-read">Read more</span>
      `;
      list.appendChild(item);
    });
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const err = document.getElementById('error');
    err.style.display = 'block';
    err.innerHTML = `<p>Unable to load articles. <a href="https://karentalk.jant.blog" style="color:var(--black);">Visit the blog directly →</a></p>`;
  }
})();
</script>

</body>
</html>
